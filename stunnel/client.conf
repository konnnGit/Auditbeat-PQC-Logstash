
foreground = yes
debug = info
pid =

[auditbeat-pqc]
client = yes
accept = 0.0.0.0:5044
connect = pqc-stunnel-server:8443

cert = /certs/client.crt
key = /certs/client.key
CAfile = /certs/CA.crt

verifyChain = yes
requireCert = yes

sslVersionMin = TLSv1.3
sslVersionMax = TLSv1.3
curves = MLKEM768
